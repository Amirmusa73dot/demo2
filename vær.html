<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5fa">
  <title>Været i Halden</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, sans-serif;
      color: #182d3e;
      background: #edf5fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --blue: #176b9a;
      --muted: #647988;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 70% 8%, #d9eefa 0, transparent 40%),
        #edf5fa;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .location {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .intro {
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .weather-card {
      overflow: hidden;
      border: 1px solid #e0ebf0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 48px rgb(34 66 86 / 9%);
    }

    .forecast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 250px;
      padding: 34px 38px;
      background: linear-gradient(125deg, #f8fcff, #eaf5fb);
    }

    .forecast-date {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .condition {
      margin: 0;
      color: #354d5e;
      font-size: 1.15rem;
      font-weight: 650;
    }

    .temperature {
      margin: 8px 0 0;
      color: #153b56;
      font-size: clamp(4.5rem, 15vw, 6.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: -0.09em;
      line-height: 1;
    }

    .weather-icon {
      flex: 0 0 auto;
      font-size: clamp(5rem, 17vw, 8rem);
      line-height: 1;
      filter: drop-shadow(0 10px 12px rgb(61 105 130 / 12%));
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #e6eef2;
    }

    .detail {
      padding: 22px 18px;
      text-align: center;
    }

    .detail + .detail {
      border-left: 1px solid #e6eef2;
    }

    .detail-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .detail-value {
      font-size: 1.08rem;
      font-weight: 750;
    }

    .source {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .source p {
      margin: 0;
      line-height: 1.5;
    }

    .yr-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 17px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .yr-link:hover {
      transform: translateY(-1px);
      background: #105579;
    }

    .yr-link:focus-visible {
      outline: 3px solid #82c9ef;
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 34px 16px;
      }

      .forecast {
        min-height: 220px;
        padding: 26px 22px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .detail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px 20px;
        text-align: left;
      }

      .detail + .detail {
        border-top: 1px solid #e6eef2;
        border-left: 0;
      }

      .detail-label {
        margin: 0;
      }

      .source {
        align-items: stretch;
        flex-direction: column;
      }

      .yr-link {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="location">Østfold · Norge</p>
    <h1>Været i Halden</h1>
    <p class="intro">Dagens værmelding, samlet på ett sted.</p>

    <section class="weather-card" aria-label="Værvarsel for Halden">
      <div class="forecast">
        <div>
          <p class="forecast-date">Fredag 30. oktober · Yr-varsel</p>
          <p class="condition">Delvis skyet</p>
          <p class="temperature">12°</p>
        </div>
        <span class="weather-icon" role="img" aria-label="Delvis skyet">🌤️</span>
      </div>
      <div class="details" aria-label="Værdetaljer">
        <div class="detail">
          <span class="detail-label">Laveste temperatur</span>
          <span class="detail-value">5°</span>
        </div>
        <div class="detail">
          <span class="detail-label">Nedbør</span>
          <span class="detail-value">0 mm</span>
        </div>
        <div class="detail">
          <span class="detail-label">Vind</span>
          <span class="detail-value">2 m/s</span>
        </div>
      </div>
    </section>

    <div class="source">
      <p>Værdata fra Yr. Se Yr for oppdatert varsel og flere dager.</p>
      <a class="yr-link" href="https://www.yr.no/nb/v%C3%A6rvarsel/daglig-tabell/1-34643" target="_blank" rel="noreferrer">
        Åpne Halden på Yr ↗
      </a>
    </div>
  </main>
</body>
</html>
